# PAMSignal — local try-it stack
#
# Brings up Loki + Grafana + Alloy + a synthetic event producer so you can
# see the PAMSignal dashboard working without needing a real Linux host with
# systemd journald.
#
# Quick start:
#   docker compose up -d
#   open http://localhost:3000   # Grafana, anonymous Admin
#
# Stop:
#   docker compose down -v       # -v wipes Loki data

services:
  loki:
    image: grafana/loki:3.3.0
    container_name: pamsignal-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  alloy:
    image: grafana/alloy:v1.5.0
    container_name: pamsignal-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/demo.alloy:/etc/alloy/config.alloy:ro
      - alloy-shared:/var/log/pamsignal-demo
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy

  synthetic:
    build: ./synthetic
    container_name: pamsignal-synthetic
    restart: unless-stopped
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ALLOY_LOG_PATH: /var/log/pamsignal-demo/pamsignal.jsonl
      HOST_COUNT: "12"
      EVENT_RATE: "2.0"
      # Push events both directly to Loki (instant labels) and to a file
      # tailed by Alloy (proves the Alloy → Loki pipeline). The dashboard
      # works against either path because the data ends up in the same Loki.
      MODE: both
    volumes:
      - alloy-shared:/var/log/pamsignal-demo
    depends_on:
      loki:
        condition: service_healthy

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: pamsignal-renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: pamsignal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
      GF_LOG_LEVEL: "warn"
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_LOG_FILTERS: "rendering:debug"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  loki-data: {}
  alloy-data: {}
  alloy-shared: {}
  grafana-data: {}
